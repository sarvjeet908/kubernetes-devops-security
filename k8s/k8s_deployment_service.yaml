apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: devsecops
  name: devsecops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops
  strategy: {}
  template:
    metadata:
      labels:
        app: devsecops
    spec:
      containers:
      - image: sarvjeet908/udemy:2
        name: devsecops-container
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: devsecops
    name: devsecops-svc
spec:
  selector:
    app: devsecops
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8081